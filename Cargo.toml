[workspace]
resolver = "2"
members = ["backend", "backend/entity", "backend/migrations"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
authors = ["xuzh"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
argon2 = "0.6.0"
axum = { version = "0.8", features = ["macros", "multipart"] }
calamine = "0.36.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
sea-orm = { version = "2.0.2", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
  "with-uuid",
  "with-json",
] }
sea-orm-migration = { version = "2.0.2", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
] }
rust_xlsxwriter = "0.99.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "signal",
  "fs",
] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
