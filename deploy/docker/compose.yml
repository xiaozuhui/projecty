name: projecty

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    restart: unless-stopped
    networks:
      - projecty-net
    volumes:
      - projecty-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  # 单镜像 = 后端 API + 前端静态产物(axum 直接托管 SPA),无独立前端容器。
  backend:
    image: projecty-backend:latest
    restart: unless-stopped
    ports:
      - "${PROJECTY_BACKEND_PORT:-28080}:8080"
    networks:
      - projecty-net
    volumes:
      - projecty-uploads:/var/lib/projecty/uploads
    environment:
      PROJECTY_ENV: ${PROJECTY_ENV:-production}
      PROJECTY_BIND_HOST: 0.0.0.0
      PROJECTY_BIND_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-projecty}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-1800}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-1209600}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  projecty-postgres:
  projecty-uploads:

networks:
  projecty-net:
