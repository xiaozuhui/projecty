name: projecty

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    networks:
      - projecty-net
    volumes:
      - projecty-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: projecty-backend:latest
    ports:
      - "${PROJECTY_BACKEND_PORT:-28081}:8080"
    networks:
      - projecty-net
    volumes:
      - projecty-uploads:/var/lib/projecty/uploads
    environment:
      PROJECTY_ENV: ${PROJECTY_ENV:-production}
      PROJECTY_BIND_HOST: 0.0.0.0
      PROJECTY_BIND_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-projecty}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-1800}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-1209600}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: projecty-frontend:latest
    networks:
      - projecty-net
    ports:
      - "${PROJECTY_FRONTEND_PORT:-28080}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      # 浏览器走同源相对路径,由前端容器代理到 docker 网络内的后端
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api/v1}
      INTERNAL_API_ORIGIN: ${INTERNAL_API_ORIGIN:-http://backend:8080}
    depends_on:
      - backend

volumes:
  projecty-postgres:
  projecty-uploads:

networks:
  projecty-net:
    name: projecty-net
    driver: bridge
